name: Semgrep

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "57 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Run Semgrep on pull-request changes
        if: ${{ github.event_name == 'pull_request' }}
        run: semgrep scan --config p/default --error --metrics=off --baseline-commit "${{ github.event.pull_request.base.sha }}" .
      - name: Run full Semgrep audit
        if: ${{ github.event_name != 'pull_request' }}
        run: semgrep scan --config p/default --metrics=off .
