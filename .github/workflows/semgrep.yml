name: Semgrep

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "57 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Run Semgrep on pull-request changes
        if: ${{ github.event_name == 'pull_request' }}
        run: semgrep scan --config p/default --error --metrics=off --baseline-commit "${{ github.event.pull_request.base.sha }}" .
      - name: Run full Semgrep audit
        if: ${{ github.event_name != 'pull_request' }}
        run: semgrep scan --config p/default --metrics=off .
