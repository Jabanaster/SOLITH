name: CI Nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  nightly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build:electron
      # Nightly validates packaging only; publishing requires an explicit
      # release workflow and token, so prevent electron-builder's implicit
      # CI publish attempt.
      - run: npm run build -- --publish never
      - run: npx playwright install chromium
      - run: npm run test:accessibility
      - run: npx playwright test tests/packaged-smoke.test.ts --config playwright.e2e.config.ts -g "sidebar collapse"
