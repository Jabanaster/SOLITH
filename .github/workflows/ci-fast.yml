name: CI Fast

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  fast:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build electron host bundle (required by trainer-host e2e in npm test)
        run: npm run build:electron
      - name: Run tests
        run: npm test | Tee-Object -FilePath npm-test.log
      - name: Verify fresh-clone report counts
        run: node scripts/verify-fresh-clone-verification.mjs Docs/Reports/FRESH_CLONE_VERIFICATION_2026-07-15.md npm-test.log
