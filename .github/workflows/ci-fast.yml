name: CI Fast

on:
  push:
    branches: [master, main, "cursor/**"]
  pull_request:
    branches: [master, main]

jobs:
  fast:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Schema.v1 import bans / legacy drift
        run: npm run verify:schema-v1-boundaries
      - name: Orphan / boundary check
        run: npm run orphan-check
      - name: Build application and installer
        run: npm run build
      - name: Run tests
        run: npm test | Tee-Object -FilePath npm-test.log
      - name: Electron smoke test
        run: npm run test:electron-smoke
      - name: Key E2E smoke flows
        run: |
          npm run test:browser-fallback
          npm run test:trainer-states-e2e
      - name: Verify fresh-clone report counts
        run: node scripts/verify-fresh-clone-verification.mjs Docs/Reports/FRESH_CLONE_VERIFICATION_2026-07-15.md npm-test.log
