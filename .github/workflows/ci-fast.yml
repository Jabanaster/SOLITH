name: CI Fast

on:
  push:
    branches: [master, main, "cursor/**"]
  pull_request:
    branches: [master, main]

jobs:
  fast:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Schema.v1 import bans / legacy drift
        run: npm run verify:schema-v1-boundaries
      - name: Orphan / boundary check
        run: npm run orphan-check
      - name: Build application and installer
        run: npm run build -- --publish never
      - name: Run tests
        run: npm test | Tee-Object -FilePath npm-test.log
      - name: Electron smoke test
        run: npm run test:electron-smoke
      - name: Key E2E smoke flows
        run: |
          npm run test:browser-fallback
          npm run test:trainer-states-e2e
      # The dated fresh-clone report intentionally records its historical
      # 803-test snapshot; comparing it with today's expanded suite creates a
      # false failure. npm test above remains the authoritative live check.
