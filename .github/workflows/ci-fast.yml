name: CI Fast

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  fast:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
