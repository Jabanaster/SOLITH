name: Vendored memoryjs integrity

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memoryjs-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Verify vendored package identity and committed artifacts
        run: node scripts/verify-vendored-memoryjs-integrity.mjs
      - name: Block unreviewed vendored source changes
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          if ! git diff --quiet "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- vendor/memoryjs-3.5.1-patched; then
            echo "Vendored memoryjs changed. Re-vendoring requires a dedicated integrity-review change with refreshed hashes and explicit review."
            git diff --name-status "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- vendor/memoryjs-3.5.1-patched
            exit 1
          fi
