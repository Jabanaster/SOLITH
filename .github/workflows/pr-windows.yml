name: PR Windows

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pr-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows native and Electron gate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Stage 7.2/7.3 §14/§18 — the native Rust scanner had NO fmt/clippy/test
      # gate anywhere in CI before this (doc 101's disclosed gap). Installed
      # early, before `npm ci`, since the fmt/clippy checks below need only
      # the Rust toolchain, not the Node dependency graph.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust fmt check (native/solith-scanner-core)
        working-directory: native/solith-scanner-core
        run: cargo fmt --check

      - name: Rust clippy (native/solith-scanner-core)
        working-directory: native/solith-scanner-core
        run: cargo clippy --release -- -D warnings

      - name: Verify Node policy
        run: node scripts/check-node.mjs

      # Native Electron dependencies and the Rust scanner are installed here;
      # --ignore-scripts would skip the repository's required postinstall.
      - name: Install dependencies and native Electron modules
        run: npm ci

      - name: Root strict TypeScript check
        run: npx tsc --noEmit

      - name: Electron TypeScript check
        run: npx tsc --project tsconfig.electron.json --noEmit

      - name: Build Electron and native output
        run: npm run build:electron

      - name: Verify Electron output
        run: npm run verify:electron-output

      # orphan-check must follow build:electron: it checks the emitted
      # dist-electron/host-entry.js and otherwise intentionally reports a
      # boundaries-only result when no host has been built.
      - name: Orphan and boundary check
        run: npm run orphan-check

      - name: Rust test (release profile — matches the canonical build)
        working-directory: native/solith-scanner-core
        run: cargo test --release

      # Stage 7 final closure §fresh-worktree finding (doc 100): the napi JS
      # test suite looks for the fixture binary under target/debug, which
      # `cargo test --release` above does not produce — a separate debug
      # build is required. This is not duplicate work: `cargo build` (no
      # --release) is fast once `cargo test --release` has already
      # populated the shared target/ dependency cache.
      - name: Rust debug build (napi test fixture dependency)
        working-directory: native/solith-scanner-core
        run: cargo build

      - name: napi tests (--expose-gc)
        working-directory: native/solith-scanner-napi
        shell: bash
        run: node --expose-gc --test test/*.test.js

      - name: Run standard test suite
        run: npm test

      # Live-memory and Playwright suites are deferred from this gate: they
      # require live game/process state or a separately managed Electron
      # browser session. The existing CI workflows own those checks.
