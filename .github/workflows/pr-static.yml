name: PR Static

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pr-static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: TypeScript and architecture checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify Node policy
        run: node scripts/check-node.mjs

      - name: Install dependencies without native postinstall scripts
        run: npm ci --ignore-scripts

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: Schema.v1 import bans and legacy drift
        run: npm run verify:schema-v1-boundaries
