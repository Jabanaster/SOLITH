<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy — LOCAL-FIRST
      Solith is offline-first. Bundled assets load from the local app package;
      trainer catalog cover art may load from Steam's image CDN only.
      - default-src 'self': everything must come from the local app bundle
      - style-src 'self' 'unsafe-inline': Vite injects inline styles during HMR
      - font-src 'self' data:: local font files and base64-encoded fonts only
      - img-src 'self' data: solith-asset: Steam CDNs: local images,
        guarded local asset protocol, inline data URIs, and catalog cover art
      - connect-src 'self': no network origins in production HTML
      - No remote scripts, no remote fonts, no eval
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      font-src 'self' data:;
      img-src 'self' data: solith-asset: https://cdn.cloudflare.steamstatic.com https://cdn.akamai.steamstatic.com;
      connect-src 'self';
      frame-src 'none';
      object-src 'none';
    " />
    <title>Solith</title>
    <link rel="icon" type="image/png" href="./solith-icon.png" />
    <meta name="description" content="Solith 2.4.0-alpha.2 — local-first game trainer and save editor for single-player offline use." />
    <style>
      .static-landing {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        color: #e8f6ff;
        background: radial-gradient(circle at 50% 10%, rgba(56, 189, 248, 0.22), transparent 34%), #020617;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .static-landing__card {
        width: min(720px, 100%);
        padding: 2rem;
        border: 1px solid rgba(56, 189, 248, 0.28);
        border-radius: 24px;
        background: rgba(10, 20, 36, 0.84);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.44);
      }
      .static-landing h1 { margin: 0 0 0.5rem; font-size: clamp(2rem, 8vw, 4rem); letter-spacing: 0.12em; }
      .static-landing p { color: #a9c4df; line-height: 1.6; }
      .static-landing a { color: #67e8f9; }
    </style>
    <!--
      Fonts: No Google Fonts CDN — Solith works fully offline.
      Inter and JetBrains Mono are referenced by name only; if installed
      locally on the system they will be used; otherwise the system stack
      provides readable fallbacks. See index.css for the fallback stack.
    -->
  </head>
  <body>
    <div id="root">
      <main class="static-landing">
        <section class="static-landing__card">
          <h1>SOLITH</h1>
          <p>Your saves. Your rules. Your machine.</p>
          <p>
            This file is the Electron/Vite app entry. To run the desktop app from source,
            use <code>npm run dev</code>. For project source and releases, open
            <a href="https://github.com/Jabanaster/SOLITH">github.com/Jabanaster/SOLITH</a>.
          </p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
