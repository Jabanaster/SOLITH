<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy — LOCAL ONLY
      ResourceForge is offline-first. No remote resources are loaded.
      - default-src 'self': everything must come from the local app bundle
      - style-src 'self' 'unsafe-inline': Vite injects inline styles during HMR
      - font-src 'self' data:: local font files and base64-encoded fonts only
      - img-src 'self' data:: local images and inline data URIs
      - connect-src 'self': no network origins in production HTML
      - No remote scripts, no remote fonts, no remote images, no eval
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      font-src 'self' data:;
      img-src 'self' data:;
      connect-src 'self';
      frame-src 'none';
      object-src 'none';
    " />
    <title>Solith — Local Game Trainer &amp; Save Editor</title>
    <meta name="description" content="Local, offline-only game trainer and save editor. Build custom trainers from save file discovery. No cloud, no memory injection, no anti-cheat risk." />
    <!--
      Fonts: No Google Fonts CDN — ResourceForge works fully offline.
      Inter and JetBrains Mono are referenced by name only; if installed
      locally on the system they will be used; otherwise the system stack
      provides readable fallbacks. See index.css for the fallback stack.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
