<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy — LOCAL-FIRST
      Solith is offline-first. Bundled assets load from the local app package;
      trainer catalog cover art may load from Steam's image CDN only.
      - default-src 'self': everything must come from the local app bundle
      - style-src 'self' 'unsafe-inline': Vite injects inline styles during HMR
      - font-src 'self' data:: local font files and base64-encoded fonts only
      - img-src 'self' data: solith-asset: Steam CDNs: local images,
        guarded local asset protocol, inline data URIs, and catalog cover art
      - connect-src 'self': no network origins in production HTML
      - No remote scripts, no remote fonts, no eval
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      font-src 'self' data:;
      img-src 'self' data: solith-asset: https://cdn.cloudflare.steamstatic.com https://cdn.akamai.steamstatic.com;
      connect-src 'self';
      frame-src 'none';
      object-src 'none';
    " />
    <title>Solith</title>
    <link rel="icon" type="image/png" href="/solith-icon.png" />
    <meta name="description" content="Local, offline-only game trainer and save editor. Build custom trainers from save file discovery. No cloud, no memory injection, no anti-cheat risk." />
    <!--
      Fonts: No Google Fonts CDN — Solith works fully offline.
      Inter and JetBrains Mono are referenced by name only; if installed
      locally on the system they will be used; otherwise the system stack
      provides readable fallbacks. See index.css for the fallback stack.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
